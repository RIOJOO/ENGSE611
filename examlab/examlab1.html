<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Lab 1: Sign-Up Form Basic</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            position: relative;
            max-width: 500px; 
            width: 90%; 
            border: 1px solid #ccc;
        }
        
        .close-btn {
            display: block;
            position: absolute;
            top: 5px;
            right: 5px; 
            border: none;
            background: none;
            font-size: 20px;
            font-weight: bold;
            color: #777;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            z-index: 10;
        }
        
        .subtitle-left {
            display: none;
        }

        h2 {
            text-align: left;
            color: #333;
            font-size: 20px;
            margin-top: 10px; 
            margin-bottom: 5px;
            line-height: 1.2;
        }
        
        .tagline {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px; 
        }
        
        .form-table {
            width: 100%;
            border-collapse: collapse;
        }

        .form-table td {
            padding: 5px 0; 
            vertical-align: top;
        }

        .form-table label {
            font-weight: bold;
            display: block; 
            font-size: 13px; 
        }

        .form-table input[type="text"],
        .form-table input[type="password"],
        .form-table input[type="email"],
        .form-table input[type="date"], 
        .form-table select {
            width: 100%;
            padding: 6px;
            margin-top: 3px;
            box-sizing: border-box;
            border: 1px solid #999;
            border-radius: 2px; 
            font-size: 13px;
        }
        
        .input-inline {
            display: flex;
            gap: 10px;
        }
        .input-inline input {
            width: 50%; 
        }
        .input-inline label {
            display: none;
        }

        .required {
            color: red;
        }

        .radio-group label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
        }
        

        .terms-box {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 15px;
            font-size: 11px;
            color: #555;
            text-align: left;
        }

        .button-group {
            text-align: center;
            padding-top: 20px;
            padding-bottom: 10px;
        }

        .button-group button {
            padding: 8px 15px;
            margin: 0 5px;
            border: 1px solid #777;
            border-radius: 2px;
            cursor: pointer;
            font-size: 14px;
        }

        .button-group #submit-btn {
            background-color: #eee;
            color: #333;
            font-weight: bold;
        }

        .button-group #reset-btn {
            display: none;
        }

    </style>
</head>
<body>
    <div class="container">
        <button class="close-btn" onclick="this.closest('.container').style.display='none';">&times;</button>
        <span class="subtitle-left"></span>
        
        <h2>สมัคร</h2>
        <span class="tagline">ง่ายและเร็ว</span>
        
        <form action="#" method="post">
            <div class="form-body">
                <table class="form-table">
                    <tr>
                        <td colspan="2">
                            <label for="full_name">ชื่อ - นามสกุล:</label>
                            <div class="input-inline">
                                <input type="text" id="firstname" name="firstname" placeholder="ชื่อ" required>
                                <input type="text" id="lastname" name="lastname" placeholder="นามสกุล" required>
                            </div>
                        </td>
                    </tr>
                    
                    <tr>
                        <td colspan="2">
                            <label for="email">อีเมล:</label>
                            <input type="email" id="email" name="email" required>
                        </td>
                    </tr>
                    
                    <tr>
                        <td colspan="2">
                            <label>รหัสผ่าน:</label>
                             <div class="input-inline">
                                <input type="password" id="password" name="password" placeholder="รหัสผ่าน" required>
                                <input type="password" id="confirm_password" name="confirm_password" placeholder="ยืนยันรหัสผ่าน" required>
                            </div>
                        </td>
                    </tr>
                    
                    <tr>
                        <td colspan="2">
                            <label for="birthdate">วันเกิด:</label>
                            <input type="date" id="birthdate" name="birthdate" required>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <label>เพศ:</label>
                            <div class="radio-group">
                                <input type="radio" id="gender_male" name="gender" value="male" required>
                                <label for="gender_male">ชาย</label>

                                <input type="radio" id="gender_female" name="gender" value="female">
                                <label for="gender_female">หญิง</label>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
            
            <div class="terms-box">
                เมื่อคลิก 'สมัคร' คุณยอมรับข้อกำหนดและเงื่อนไขของเว็บไซต์ และยินยอมให้เราส่งอีเมลเกี่ยวกับสินค้าและบริการได้ และคุณได้อ่านนโยบายความเป็นส่วนตัวของเราแล้ว
            </div>

            <div class="button-group">
                <button type="submit" id="submit-btn">สมัคร</button>
                <button type="reset" id="reset-btn">ยกเลิก (Reset)</button> 
            </div>
        </form>
    </div>
</body>
</html>
