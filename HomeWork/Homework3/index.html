<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab css1 - valorant </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1 id="main-header">VALORANT ROLES</h1>
    
    <div class="card-wrapper">
        <div class="card">
            <img src="img/Jett.jpg" alt="Duelist" class="card-img">
            <div class="card-content">
                <h3 class="highlight">Duelist</h3>
                <p>เป็นหน่วยจู่โจมหลัก เข้าทำเป็นคนแรก เพื่อสร้างพื้นที่ว่างและสังหารศัตรู</p>
            </div>
        </div>

        <div class="card">
            <img src="img/omen.avif" alt="Controller" class="card-img">
            <div class="card-content">
                <h3 class="highlight">Controller</h3>
                <p>เป็นหน่วยควบคุม ใช้ในการสร้างสถานการณ์และควบคุมพื้นที่</p>
            </div>
        </div>

        <div class="card">
            <img src="img/sova.jpg" alt="Initiator" class="card-img">
            <div class="card-content">
                <h3 class="highlight">Initiator</h3>
                <p>เป็นหน่วยเริ่มต้น ใช้ในการเปิดฉากและสร้างโอกาสให้ทีม</p>
            </div>
        </div>

        <div class="card">
            <img src="img/sage.jpg" alt="Sentinel" class="card-img">
            <div class="card-content">
                <h3 class="highlight">Sentinel</h3>
                <p>เป็นหน่วยปกป้อง ใช้ในการป้องกันพื้นที่และสนับสนุนทีม</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
